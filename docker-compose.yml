version: '3.8'

services:
  backend:
    build:
      context: .
      target: backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./backend/requirements.txt:/app/requirements.txt
    env_file:
      - backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn server:app --reload --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: .
      target: frontend-build
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - frontend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: >
      sh -c "yarn install &&
             yarn start"

  # Production stack
  production:
    build:
      context: .
      target: production
    ports:
      - "80:80"
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=kickstarter_db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mongodb_data: